<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560"
     role="img" aria-label="반경 분석 지도 위에 유동인구 밀도가 표시된 화면">
  <title>반경 상권분석 지도</title>
  <style>
    /* 자체 애니메이션 — &lt;img&gt; 로 불러도 움직인다. */
    .ring      { animation: ring 4s cubic-bezier(.22,.61,.36,1) infinite; transform-origin: 352px 268px; }
    .ring-2    { animation-delay: 1.33s; }
    .ring-3    { animation-delay: 2.66s; }
    .cell      { animation: flicker 5s ease-in-out infinite; }
    .traffic   { stroke-dasharray: 14 22; animation: flow 3.2s linear infinite; }
    .traffic-b { animation-duration: 4.6s; animation-direction: reverse; }
    .pin       { animation: bob 3s ease-in-out infinite; transform-origin: 352px 268px; }
    .chip      { animation: float 6s ease-in-out infinite; }
    .chip-b    { animation-delay: -2s; animation-duration: 7s; }
    .chip-c    { animation-delay: -4s; animation-duration: 6.5s; }
    .scan      { animation: scan 6s cubic-bezier(.45,0,.55,1) infinite; }

    @keyframes ring   { 0% { transform: scale(.28); opacity: 0 } 12% { opacity: .85 }
                        100% { transform: scale(1); opacity: 0 } }
    @keyframes flicker{ 0%,100% { opacity: .25 } 50% { opacity: .9 } }
    @keyframes flow   { to { stroke-dashoffset: -72 } }
    @keyframes bob    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @keyframes float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes scan   { 0% { transform: translateY(-40px); opacity: 0 } 10% { opacity: .55 }
                        90% { opacity: .55 } 100% { transform: translateY(560px); opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .ring, .cell, .traffic, .pin, .chip, .scan { animation: none }
      .ring { opacity: .35; transform: scale(1) }
    }
  </style>

  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="720" height="560" rx="22"/></clipPath>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#e4f2ff"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0593ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00c6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#0593ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0593ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0593ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#100f14" flood-opacity=".14"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="560" fill="#f2f5f9"/>

    <!-- 하천 -->
    <path d="M-20 118 C 150 92, 250 190, 430 176 S 660 96, 760 130 L760 196 C 660 166, 560 236, 430 240 S 150 168, -20 190 Z"
          fill="url(#water)"/>

    <!-- 블록 -->
    <g fill="#e5eaf1">
      <rect x="42"  y="232" width="118" height="86"  rx="7"/>
      <rect x="42"  y="330" width="118" height="120" rx="7"/>
      <rect x="176" y="232" width="150" height="132" rx="7"/>
      <rect x="176" y="376" width="150" height="74"  rx="7"/>
      <rect x="342" y="232" width="132" height="88"  rx="7"/>
      <rect x="342" y="332" width="132" height="118" rx="7"/>
      <rect x="490" y="232" width="176" height="104" rx="7"/>
      <rect x="490" y="348" width="176" height="102" rx="7"/>
      <rect x="42"  y="52"  width="150" height="52"  rx="7"/>
      <rect x="500" y="30"  width="166" height="58"  rx="7"/>
      <rect x="42"  y="462" width="284" height="70"  rx="7"/>
      <rect x="342" y="462" width="324" height="70"  rx="7"/>
    </g>

    <!-- 도로 -->
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
      <path d="M0 222 H720" stroke-width="13"/>
      <path d="M0 456 H720" stroke-width="11"/>
      <path d="M168 0 V560" stroke-width="12"/>
      <path d="M334 0 V560" stroke-width="10"/>
      <path d="M482 0 V560" stroke-width="12"/>
      <path d="M0 324 H720" stroke-width="8"/>
    </g>

    <!-- 도로 위 흐름 -->
    <g stroke-linecap="round" fill="none" opacity=".85">
      <path class="traffic"   d="M0 222 H720" stroke="#0593ff" stroke-width="3.5"/>
      <path class="traffic traffic-b" d="M334 0 V560" stroke="#00c6ff" stroke-width="3"/>
      <path class="traffic"   d="M0 456 H720" stroke="#09e092" stroke-width="3" style="animation-duration:5.4s"/>
    </g>

    <!-- 유동인구 밀도 셀 -->
    <g>
      <rect class="cell" x="286" y="196" width="26" height="26" rx="5" fill="#0593ff" style="animation-delay:-.2s"/>
      <rect class="cell" x="316" y="196" width="26" height="26" rx="5" fill="#00c6ff" style="animation-delay:-.9s"/>
      <rect class="cell" x="316" y="226" width="26" height="26" rx="5" fill="#405ff5" style="animation-delay:-1.6s"/>
      <rect class="cell" x="346" y="226" width="26" height="26" rx="5" fill="#0593ff" style="animation-delay:-2.3s"/>
      <rect class="cell" x="376" y="226" width="26" height="26" rx="5" fill="#00c6ff" style="animation-delay:-3.0s"/>
      <rect class="cell" x="346" y="256" width="26" height="26" rx="5" fill="#0593ff" style="animation-delay:-.5s"/>
      <rect class="cell" x="376" y="286" width="26" height="26" rx="5" fill="#405ff5" style="animation-delay:-1.2s"/>
      <rect class="cell" x="406" y="256" width="26" height="26" rx="5" fill="#09e092" style="animation-delay:-2.8s"/>
      <rect class="cell" x="286" y="286" width="26" height="26" rx="5" fill="#09e092" style="animation-delay:-3.6s"/>
      <rect class="cell" x="256" y="256" width="26" height="26" rx="5" fill="#00c6ff" style="animation-delay:-4.2s"/>
      <rect class="cell" x="406" y="316" width="26" height="26" rx="5" fill="#0593ff" style="animation-delay:-1.9s"/>
      <rect class="cell" x="316" y="316" width="26" height="26" rx="5" fill="#405ff5" style="animation-delay:-2.6s"/>
    </g>

    <!-- 분석 반경 -->
    <circle cx="352" cy="268" r="150" fill="url(#glow)"/>
    <circle class="ring"        cx="352" cy="268" r="150" fill="none" stroke="#0593ff" stroke-width="2.5"/>
    <circle class="ring ring-2" cx="352" cy="268" r="150" fill="none" stroke="#0593ff" stroke-width="2.5"/>
    <circle class="ring ring-3" cx="352" cy="268" r="150" fill="none" stroke="#00c6ff" stroke-width="2.5"/>
    <circle cx="352" cy="268" r="150" fill="none" stroke="#0593ff" stroke-width="2.5"
            stroke-dasharray="7 9" opacity=".9"/>

    <!-- 중심 핀 -->
    <g class="pin" filter="url(#soft)">
      <path d="M352 236 c-13.8 0-25 11.2-25 25 0 18 25 43 25 43s25-25 25-43c0-13.8-11.2-25-25-25z" fill="#0593ff"/>
      <circle cx="352" cy="261" r="9" fill="#ffffff"/>
    </g>

    <!-- 스캔 라인 -->
    <rect class="scan" x="0" y="0" width="720" height="46" fill="url(#scanline)"/>

    <!-- 떠 있는 지표 칩 -->
    <g class="chip" filter="url(#soft)">
      <rect x="470" y="120" width="196" height="66" rx="14" fill="#ffffff"/>
      <circle cx="500" cy="153" r="14" fill="#eaf4ff"/>
      <path d="M494 157 v-8 M500 157 v-13 M506 157 v-5" stroke="#0593ff" stroke-width="2.6" stroke-linecap="round"/>
      <text x="524" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#7b8394">점심 유동인구</text>
      <text x="524" y="170" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#100f14">45,499</text>
    </g>

    <g class="chip chip-b" filter="url(#soft)">
      <rect x="46" y="128" width="176" height="66" rx="14" fill="#ffffff"/>
      <circle cx="76" cy="161" r="14" fill="#e8fbf3"/>
      <path d="M70 161 h12 M76 155 v12" stroke="#09e092" stroke-width="2.6" stroke-linecap="round"/>
      <text x="100" y="154" font-family="system-ui, sans-serif" font-size="12" fill="#7b8394">배후세대</text>
      <text x="100" y="178" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#100f14">9,266</text>
    </g>

    <g class="chip chip-c" filter="url(#soft)">
      <rect x="440" y="404" width="208" height="66" rx="14" fill="#ffffff"/>
      <circle cx="470" cy="437" r="14" fill="#eef0ff"/>
      <path d="M464 441 l5-7 4 4 5-8" stroke="#405ff5" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <text x="494" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#7b8394">월 카드매출</text>
      <text x="494" y="454" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#100f14">26.3억원</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="719" height="559" rx="22" fill="none" stroke="#d8e1ef"/>
</svg>
