<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"
     role="img" aria-label="막대 차트가 그려지는 상권분석 리포트">
  <style>
    .bar { transform-origin: 0 100%; animation: grow 3.4s cubic-bezier(.22,.61,.36,1) infinite; }
    .b2 { animation-delay: .12s } .b3 { animation-delay: .24s }
    .b4 { animation-delay: .36s } .b5 { animation-delay: .48s }
    .line { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 3.4s ease-in-out infinite; }
    @keyframes grow { 0%,8% { transform: scaleY(.06) } 38%,72% { transform: scaleY(1) } 100% { transform: scaleY(.06) } }
    @keyframes draw { 0%,10% { stroke-dashoffset: 220 } 45%,75% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 220 } }
    @media (prefers-reduced-motion: reduce) { .bar,.line { animation: none } .line { stroke-dashoffset: 0 } }
  </style>

  <rect width="320" height="200" rx="14" fill="#f6f8fa"/>
  <rect x="26" y="18" width="268" height="164" rx="12" fill="#ffffff" stroke="#e6ecf4"/>

  <rect x="44" y="36" width="86" height="9" rx="4.5" fill="#100f14" opacity=".85"/>
  <rect x="44" y="53" width="132" height="7" rx="3.5" fill="#c8d3e0"/>
  <rect x="228" y="34" width="48" height="18" rx="9" fill="#eaf4ff"/>
  <circle cx="240" cy="43" r="3.5" fill="#0593ff"/>
  <rect x="248" y="40" width="20" height="6" rx="3" fill="#0593ff" opacity=".55"/>

  <g transform="translate(44 152)">
    <rect class="bar"    x="0"   y="-52" width="20" height="52" rx="4" fill="#0593ff"/>
    <rect class="bar b2" x="30"  y="-78" width="20" height="78" rx="4" fill="#0593ff"/>
    <rect class="bar b3" x="60"  y="-96" width="20" height="96" rx="4" fill="#405ff5"/>
    <rect class="bar b4" x="90"  y="-66" width="20" height="66" rx="4" fill="#00c6ff"/>
    <rect class="bar b5" x="120" y="-40" width="20" height="40" rx="4" fill="#09e092"/>
    <path class="line" d="M10 -52 L40 -78 L70 -96 L100 -66 L130 -40"
          fill="none" stroke="#100f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
    <path d="M-6 4 H146" stroke="#e6ecf4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(212 84)">
    <rect x="0" y="0"  width="64" height="9" rx="4.5" fill="#eef2f9"/>
    <rect x="0" y="18" width="52" height="9" rx="4.5" fill="#eef2f9"/>
    <rect x="0" y="36" width="60" height="9" rx="4.5" fill="#eef2f9"/>
    <rect x="0" y="54" width="42" height="9" rx="4.5" fill="#eef2f9"/>
  </g>
</svg>
